  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            overflow-x: hidden;
        }

        html {
            height: 100%;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        #main-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        #subtitle {
            font-size: 20px;
            opacity: 0.95;
            margin-bottom: 20px;
        }

        #instruction {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 12px;
            display: inline-block;
            color: #667eea;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .club-filter {
            text-align: center;
            margin-bottom: 30px;
        }

        .club-filter select {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            background: white;
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            min-width: 250px;
        }

        .club-filter select:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .club-filter select:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
        }

        #clubBackgroundLogo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            opacity: 0.08;
            z-index: 0;
            pointer-events: none;
            display: none;
        }

        #clubBackgroundLogo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .players-section {
            position: relative;
            z-index: 1;
        }

        #playersGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .player-card {
            background: transparent;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .player-card:hover {
            transform: translateY(-5px);
        }

        .player-circle {
            position: relative;
            width: 100px;
            height: 130px;
            margin: 0 auto 12px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.3);
            overflow: visible;
            transition: all 0.3s ease;
            background: transparent;
        }

        .player-card.selected .player-circle {
            border-color: #4caf50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.8), 0 4px 10px rgba(0,0,0,0.3);
        }

        .player-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

         .club-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 35px;
            height: 35px;
            background: white;
            border-radius: 50%;
            padding: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transform: translate(20%, 20%);
            z-index: 5;
            position: relative;
        }
        .club-badge::after {
            content: attr(data-country);
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .club-badge:hover::after {
            opacity: 1;
        }

        .club-badge img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .player-name {
            font-weight: 600;
            color: white;
            font-size: 14px;
            line-height: 1.3;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        #resultsSection {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            margin-top: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        #resultsSection.visible {
            max-height: 2000px;
            opacity: 1;
        }

        .results-title {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }

        #selectedPlayersList {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 250px;
            z-index: 100;
        }

        .selected-player-badge {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
        }

        .selected-player-badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(102, 126, 234, 0.4);
        }

        .period-item {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .period-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .club-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .club-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .club-name {
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }

        .period-details {
            color: #666;
            line-height: 1.8;
        }

        .players-list {
            margin-top: 10px;
            font-style: italic;
            color: #667eea;
        }

        .no-common {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            #main-title {
                font-size: 32px;
            }

            #subtitle {
                font-size: 16px;
            }

            #playersGrid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 15px;
            }

            .player-circle {
                width: 80px;
                height: 80px;
            }

            #resultsSection {
                padding: 20px;
            }
        }
    </style>

            if (clubName) {
                const logoUrl = getClubLogo(clubName);
                bgLogoDiv.innerHTML = `<img src="${logoUrl}" alt="${clubName}" onerror="this.parentElement.style.display='none'">`;
                bgLogoDiv.style.display = 'block';
            } else {
                bgLogoDiv.innerHTML = '';
                bgLogoDiv.style.display = 'none';
            }
        }

        function renderPlayers() {
            const grid = document.getElementById('playersGrid');
            grid.innerHTML = currentPlayers.map(player => {
                const nationalTeam = player.national && player.national.length > 0 ? player.national[0] : null;
                const nationalBadge = nationalTeam ? `
                    <div class="club-badge">
                        <img src="${getNationalLogo(nationalTeam.name)}" alt="${nationalTeam.name}" onerror="this.parentElement.style.display='none'">

        function selectPlayer(player) {
            const existingIndex = selectedPlayers.findIndex(p => p.id === player.id);
            
            if (existingIndex > -1) {
                selectedPlayers.splice(existingIndex, 1);
            } else {
                if (selectedPlayers.length >= 5) {
                    return;
                }
                selectedPlayers.push(player);
            }
            
            renderPlayers();
            updateResults();
        }

        function removePlayer(playerId) {
            selectedPlayers = selectedPlayers.filter(p => p.id !== playerId);
            updateResults();
            renderPlayers();
        }

        function updateResults() {
            const resultsSection = document.getElementById('resultsSection');
            const selectedPlayersList = document.getElementById('selectedPlayersList');
            const commonPeriods = document.getElementById('commonPeriods');
            
            if (selectedPlayers.length < 2) {
                resultsSection.classList.remove('visible');
                return;
            }
            
            resultsSection.classList.add('visible');
            
            selectedPlayersList.innerHTML = '';
            selectedPlayers.forEach(p => {
                const badge = document.createElement('div');
                badge.className = 'selected-player-badge';
                badge.innerHTML = `${p.name}<span style="cursor: pointer; margin-left: 8px; font-weight: bold; font-size: 16px;">✕</span>`;
                
                badge.querySelector('span').addEventListener('click', (e) => {
                    e.stopPropagation();
                    removePlayer(p.id);
                });
                
                selectedPlayersList.appendChild(badge);
            });

            const commonClubs = findCommonClubPeriods(selectedPlayers);
            const commonNationals = findCommonNationalPeriods(selectedPlayers);
            
            let html = '';
            
            if (commonClubs.length > 0) {
                html += '<h3 style="color: #667eea; margin-bottom: 15px;">🏆 Clubs</h3>';
                html += commonClubs.map(club => `
                    <div class="period-item">
                        <div class="club-header">
                            <img src="${getClubLogo(club.name)}" alt="${club.name}" class="club-logo" onerror="this.style.display='none'">
                            <div class="club-name">${club.name}</div>
                        </div>
                        <div class="period-details">
                            <strong>Période:</strong> ${club.start} - ${club.end} (${club.end - club.start + 1} ${club.end - club.start > 0 ? 'ans' : 'an'})
                            <div class="players-list">
                                Joueurs: ${club.players.join(', ')}
                            </div>
                        </div>
                    </div>
                `).join('');
            }
            
            if (commonNationals.length > 0) {
                html += '<h3 style="color: #28a745; margin-top: 25px; margin-bottom: 15px;">🌍 Sélections nationales</h3>';
                html += commonNationals.map(nat => `
                    <div class="period-item" style="border-left-color: #28a745;">
                        <div class="club-header">
                            <img src="${getNationalLogo(nat.name)}" alt="${nat.name}" class="club-logo" onerror="this.style.display='none'">
                            <div class="club-name">${nat.name}</div>
                        </div>
                        <div class="period-details">
                            <strong>Période:</strong> ${nat.start} - ${nat.end} (${nat.end - nat.start + 1} ${nat.end - nat.start > 0 ? 'ans' : 'an'})
                            <div class="players-list" style="color: #28a745;">
                                Joueurs: ${nat.players.join(', ')}
                            </div>
                        </div>
                    </div>
                `).join('');
            }
            
            if (commonClubs.length === 0 && commonNationals.length === 0) {
                html = '<div class="no-common">Aucune période commune trouvée pour ces joueurs</div>';
            }
            
            commonPeriods.innerHTML = html;
        }

        function findCommonClubPeriods(players) {
            const clubMap = new Map();
            
            players.forEach(player => {
                player.clubs.forEach(club => {
                    const key = club.name;
                    if (!clubMap.has(key)) {
                        clubMap.set(key, {
                            name: club.name,
                            periods: []
                        });
                    }
                    clubMap.get(key).periods.push({
                        player: player.name,
                        start: club.start,
                        end: club.end
                    });
                });
            });
            
            const commonClubs = [];
            
            clubMap.forEach(club => {
                if (club.periods.length >= 2) {
                    const overlapStart = Math.max(...club.periods.map(p => p.start));
                    const overlapEnd = Math.min(...club.periods.map(p => p.end));
                    
                    if (overlapStart <= overlapEnd) {
                        commonClubs.push({
                            name: club.name,
                            start: overlapStart,
                            end: overlapEnd,
                            players: club.periods.map(p => p.player)
                        });
                    }
                }
            });
            
            return commonClubs.sort((a, b) => b.start - a.start);
        }

        function findCommonNationalPeriods(players) {
            const nationalMap = new Map();
            
            players.forEach(player => {
                if (player.national) {
                    player.national.forEach(nat => {
                        const key = nat.name;
                        if (!nationalMap.has(key)) {
                            nationalMap.set(key, {
                                name: nat.name,
                                periods: []
                            });
                        }
                        nationalMap.get(key).periods.push({
                            player: player.name,
                            start: nat.start,
                            end: nat.end
                        });
                    });
                }
            });
            
            const commonNationals = [];
            
            nationalMap.forEach(nat => {
                if (nat.periods.length >= 2) {
                    const overlapStart = Math.max(...nat.periods.map(p => p.start));
                    const overlapEnd = Math.min(...nat.periods.map(p => p.end));
                    
                    if (overlapStart <= overlapEnd) {
                        commonNationals.push({
                            name: nat.name,
                            start: overlapStart,
                            end: overlapEnd,
                            players: nat.periods.map(p => p.player)
                        });
                    }
                }
            });
            
            return commonNationals.sort((a, b) => b.start - a.start);
        }
