  <style>
        body {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100%;
            height: 100%;
        }
        
        html {
            height: 100%;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }
        
        .club-filter {
            position: absolute;
            top: 0;
            right: 0;
        }
        
        .club-filter select {
            padding: 12px 20px;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.95);
            color: #667eea;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        
        .club-filter select:hover {
            border-color: rgba(255,255,255,0.5);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        
        h1 {
            color: #ffffff;
            font-size: 48px;
            margin: 0 0 10px 0;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .subtitle {
            color: #f0f0f0;
            font-size: 20px;
            margin: 0 0 20px 0;
        }
        
        .instruction {
            background: rgba(255,255,255,0.95);
            padding: 15px 25px;
            border-radius: 12px;
            display: inline-block;
            color: #667eea;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .player-card {
            cursor: pointer;
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .player-card:hover {
            transform: translateY(-5px);
        }
        
        .player-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 10px;
            border: 4px solid transparent;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 700;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .player-card.selected .player-circle {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255,215,0,0.6), 0 4px 10px rgba(0,0,0,0.2);
            transform: scale(1.1);
        }
        
        .player-name {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        
        .results-section {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            display: none;
        }
        
        .results-section.visible {
            display: block;
        }
        
        .results-header {
            color: #667eea;
            font-size: 28px;
            margin: 0 0 20px 0;
            font-weight: 700;
        }
        
        .selected-players {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .selected-player-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .common-periods {
            margin-top: 20px;
        }
        
        .period-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        
        .club-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }
        
        .club-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }
        
        .club-name {
            font-size: 22px;
            font-weight: 700;
            color: #333;
        }
        
        .period-details {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
        }
        
        .players-list {
            margin-top: 8px;
            color: #667eea;
            font-weight: 600;
        }
        
        .no-common {
            text-align: center;
            color: #888;
            font-size: 18px;
            padding: 30px;
        }
        
        .national-team-badge {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }

        let selectedPlayers = [];
        let currentPlayers = [];

        function initializePlayers() {
            const clubSelect = document.getElementById('clubSelect');
            const selectedClub = clubSelect.value;
            
            if (selectedClub) {
                currentPlayers = allPlayers[selectedClub] || [];
            } else {
                currentPlayers = Object.values(allPlayers).flat()
                    .filter((player, index, self) => 
                        index === self.findIndex(p => p.name === player.name)
                    )
                    .slice(0, 50);
            }
            
            renderPlayers();
        }

        function renderPlayers() {
            const grid = document.getElementById('playersGrid');
            grid.innerHTML = currentPlayers.map(player => `
                <div class="player-card ${selectedPlayers.some(p => p.id === player.id) ? 'selected' : ''}" 
                     data-player-id="${player.id}"
                     onclick='selectPlayer(${JSON.stringify(player).replace(/'/g, "&apos;")})'>
                    <div class="player-circle" style="background: ${player.color};">
                        ${player.initials}
                    </div>
                    <div class="player-name">${player.name}</div>
                </div>
            `).join('');
        }

        function selectPlayer(player) {
            const existingIndex = selectedPlayers.findIndex(p => p.id === player.id);
            
            if (existingIndex > -1) {
                selectedPlayers.splice(existingIndex, 1);
            } else {
                if (selectedPlayers.length >= 5) {
                    return;
                }
                selectedPlayers.push(player);
            }
            
            renderPlayers();
            updateResults();
        }

                `<div class="selected-player-badge">${p.name}</div>`
            ).join('');
            
            const commonClubs = findCommonClubPeriods(selectedPlayers);
            const commonNationals = findCommonNationalPeriods(selectedPlayers);
            
            let html = '';
            
            if (commonClubs.length > 0) {
                html += '<h3 style="color: #667eea; margin-bottom: 15px;">🏆 Clubs</h3>';
                html += commonClubs.map(club => `
                    <div class="period-item">
                        <div class="club-header">
                            <img src="${getClubLogo(club.name)}" alt="${club.name}" class="club-logo" onerror="this.style.display='none'">
                            <div class="club-name">${club.name}</div>
                        </div>
                        <div class="period-details">
                            <strong>Période:</strong> ${club.start} - ${club.end} (${club.end - club.start + 1} ${club.end - club.start > 0 ? 'ans' : 'an'})
                            <div class="players-list">
                                Joueurs: ${club.players.join(', ')}
                            </div>
                        </div>
                    </div>
                `).join('');
            }
            
            if (commonNationals.length > 0) {
                html += '<h3 style="color: #28a745; margin-top: 25px; margin-bottom: 15px;">🌍 Sélections nationales</h3>';
                html += commonNationals.map(nat => `

                html = '<div class="no-common">Aucune période commune trouvée pour ces joueurs</div>';
            }
            
            commonPeriods.innerHTML = html;
        }

        function findCommonClubPeriods(players) {
            const clubMap = new Map();
            
            players.forEach(player => {
                player.clubs.forEach(club => {
                    const key = club.name;
                    if (!clubMap.has(key)) {
                        clubMap.set(key, {
                            name: club.name,
                            periods: []
                        });
                    }
                    clubMap.get(key).periods.push({
                        player: player.name,
                        start: club.start,
                        end: club.end
                    });
                });
            });
            
            const commonClubs = [];
            
            clubMap.forEach(club => {
                if (club.periods.length >= 2) {
                    const overlapStart = Math.max(...club.periods.map(p => p.start));
                    const overlapEnd = Math.min(...club.periods.map(p => p.end));
                    
                    if (overlapStart <= overlapEnd) {
                        commonClubs.push({
                            name: club.name,
                            start: overlapStart,
                            end: overlapEnd,
                            players: club.periods.map(p => p.player)
                        });
                    }
                }
            });
            
            return commonClubs.sort((a, b) => b.start - a.start);
        }

        function findCommonNationalPeriods(players) {
            const nationalMap = new Map();
            
            players.forEach(player => {
                if (player.national) {
                    player.national.forEach(nat => {
                        const key = nat.name;
                        if (!nationalMap.has(key)) {
                            nationalMap.set(key, {
                                name: nat.name,
                                periods: []
                            });
                        }
                        nationalMap.get(key).periods.push({
                            player: player.name,
                            start: nat.start,
                            end: nat.end
                        });
                    });
                }
            });
            
            const commonNationals = [];
            
            nationalMap.forEach(nat => {
                if (nat.periods.length >= 2) {
                    const overlapStart = Math.max(...nat.periods.map(p => p.start));
                    const overlapEnd = Math.min(...nat.periods.map(p => p.end));
                    
                    if (overlapStart <= overlapEnd) {
                        commonNationals.push({
                            name: nat.name,
                            start: overlapStart,
                            end: overlapEnd,
                            players: nat.periods.map(p => p.player)
                        });
                    }
                }
            });
            
            return commonNationals.sort((a, b) => b.start - a.start);
        }
